name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, typecheck, unit + e2e tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    env:
      # Keep the MongoDB binary used by the e2e tests outside node_modules so it can be cached.
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - uses: actions/cache@v6
        with:
          path: .cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('apps/api/package-lock.json') }}
          restore-keys: mongodb-binaries-${{ runner.os }}-
      - run: npm ci
      - run: npm run lint:check
      - run: npm run typecheck
      - run: npm test -- --ci
      - run: npm run test:e2e -- --ci
      - run: npm run build

  web:
    name: Web (lint, format, typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker (build images, run full stack, smoke test)
    needs: [api, web]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Create .env with a throwaway JWT secret
        run: echo "JWT_SECRET=$(openssl rand -base64 48)" > .env
      - name: Build images
        run: docker compose build
      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 120
      - name: Smoke test through nginx
        run: ./scripts/smoke-test.sh
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v
